<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL SharedArrayBuffer VFX Engine</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      margin: 0 0 5px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    p {
      margin: 0;
      font-size: 14px;
      opacity: 0.7;
    }
    #stats {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: monospace;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Sleek glassmorphism menu panel for VFX selection */
    #vfx-selector {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      width: 260px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      max-height: 85vh;
      overflow-y: auto;
    }
    .selector-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .vfx-option {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      margin: 5px 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .vfx-option:hover {
      background: rgba(0, 210, 255, 0.1);
      border-color: rgba(0, 210, 255, 0.3);
    }
    .vfx-option.active {
      background: rgba(0, 210, 255, 0.2);
      border-color: rgba(0, 210, 255, 0.6);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
    }
    .option-info {
      display: flex;
      flex-direction: column;
    }
    .option-name {
      font-size: 12px;
      font-weight: 500;
    }
    .option-desc {
      font-size: 9px;
      opacity: 0.5;
      margin-top: 1px;
    }
    #dps-panel {
      position: absolute;
      bottom: 80px;
      right: 20px;
      z-index: 100;
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      width: 260px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      font-size: 13px;
      pointer-events: auto;
      box-sizing: border-box;
    }
    .dps-stat {
      margin: 6px 0;
      opacity: 0.9;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <!-- Premium MMORPG Lobby — Tailwind v4, ember/stone palette -->
  <div id="lobby-overlay"
       class="fixed inset-0 z-[10000] flex items-center justify-center overflow-hidden font-[Outfit,sans-serif]"
       style="background: radial-gradient(ellipse at 35% 25%, #1c1007 0%, #0a0705 55%, #0d0a04 100%);">

    <!-- subtle cross-hatch texture -->
    <div class="absolute inset-0 pointer-events-none opacity-[0.04]"
         style="background-image: url(&quot;data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40' fill='none' stroke='%23f59e0b' stroke-width='1'/%3E%3C/svg%3E&quot;);">
    </div>

    <!-- card: compact 420px floating card -->
    <div class="relative z-10 box-border"
         style="max-width: 420px; width: 92%; margin: auto; background: rgba(18,12,6,0.88); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
                border: 1px solid rgba(251,146,60,0.22); border-radius: 20px; padding: 28px 32px;
                box-shadow: 0 32px 80px rgba(0,0,0,0.85), 0 0 60px rgba(251,146,60,0.05) inset; animation: fadeUp 0.35s ease-out;">
      <style>
        @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
        .lfield input,.lfield select {
          width:100%; padding:10px 13px; box-sizing:border-box; outline:none;
          background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
          border-radius:10px; color:#f5f0e8; font-size:13px; font-family:inherit;
          transition:border-color .2s, box-shadow .2s;
        }
        .lfield input:focus,.lfield select:focus {
          border-color:rgba(251,146,60,0.5);
          box-shadow: 0 0 0 3px rgba(251,146,60,0.1);
        }
        .lfield select { background:#120d06; cursor:pointer; }
        .ltab { flex:1; padding:8px 0; border:none; background:transparent; color:rgba(255,255,255,0.4); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; border-radius:8px; transition:all .2s; letter-spacing:.5px; }
        .ltab.active { background:rgba(251,146,60,0.15); color:#fb923c; border:1px solid rgba(251,146,60,0.25); box-shadow:0 0 14px rgba(251,146,60,0.1); }
        .rcard { padding:8px 4px; border-radius:10px; border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03); cursor:pointer; text-align:center; transition:all .2s; }
        .rcard:hover { border-color:rgba(251,146,60,0.3); background:rgba(251,146,60,0.07); }
        .rcard.selected { border-color:rgba(251,146,60,0.55); background:rgba(251,146,60,0.12); box-shadow:0 0 16px rgba(251,146,60,0.14); }
        #lobby-submit-auth, #lobby-submit-session { width:100%; padding:12px; margin-top:6px; background:linear-gradient(135deg,#d97706 0%,#92400e 100%); border:none; border-radius:10px; color:#fff8ee; font-size:13px; font-weight:800; font-family:inherit; cursor:pointer; letter-spacing:2px; box-shadow:0 4px 24px rgba(217,119,6,0.35); transition:transform .12s,box-shadow .2s,opacity .2s; }
        #lobby-submit-auth:hover, #lobby-submit-session:hover { transform:translateY(-1px); box-shadow:0 8px 32px rgba(217,119,6,0.45); }
        #lobby-submit-auth:active, #lobby-submit-session:active { transform:translateY(0); }
        #lobby-submit-auth:disabled, #lobby-submit-session:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        #lobby-error { margin:10px 0 0; padding:8px 12px; border-radius:8px; font-size:11px; display:none; }
        #lobby-error.error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; }
        #lobby-error.info  { background:rgba(251,146,60,0.08); border:1px solid rgba(251,146,60,0.2); color:#fcd34d; }
        #lobby-logout-btn { font-size:11px; color:rgba(255,255,255,0.3); background:none; border:none; cursor:pointer; text-decoration:underline; font-family:inherit; display:block; margin:10px auto 0; transition:color .2s; }
        #lobby-logout-btn:hover { color:rgba(255,255,255,0.65); }
        .savatar { width:56px; height:56px; border-radius:50%; margin:0 auto 10px; background:linear-gradient(135deg,#d97706,#7c2d12); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#fff8ee; box-shadow:0 0 28px rgba(217,119,6,0.4); }
      </style>

      <!-- logo -->
      <h2 class="m-0 mb-1 text-[22px] font-black tracking-[3px] text-center"
          style="background:linear-gradient(135deg,#fbbf24 0%,#d97706 50%,#c2410c 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
        ⚔ MULTI-TRADE RPG
      </h2>
      <p class="text-center text-[10px] tracking-[2px] text-stone-500 mt-0 mb-5">MULTIPLAYER ONLINE BATTLE ARENA</p>

      <!-- Auth panel -->
      <div id="lobby-auth-panel">
        <!-- tabs -->
        <div class="flex gap-0 rounded-[10px] p-1 mb-6" style="background:rgba(255,255,255,0.04);">
          <button class="ltab active" id="tab-login"    onclick="lobbySetTab('login')">Login</button>
          <button class="ltab"        id="tab-register" onclick="lobbySetTab('register')">Register</button>
        </div>

        <div class="lfield mb-4">
          <label class="block text-[10px] uppercase tracking-[1.5px] text-stone-500 font-semibold mb-1.5">Username</label>
          <input type="text" id="lobby-username" placeholder="Enter username" autocomplete="username">
        </div>

        <div class="lfield mb-4">
          <label class="block text-[10px] uppercase tracking-[1.5px] text-stone-500 font-semibold mb-1.5">Password</label>
          <input type="password" id="lobby-password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <!-- Role selection — register only -->
        <div class="lfield mb-4" id="lobby-role-section" style="display:none;">
          <label class="block text-[10px] uppercase tracking-[1.5px] text-stone-500 font-semibold mb-2">Choose Your Role</label>
          <div class="grid grid-cols-3 gap-2">
            <div class="rcard selected" data-role="archer"   onclick="lobbySelectRole('archer')">
              <div class="text-xl mb-1">🏹</div>
              <div class="text-[9px] font-bold tracking-wider text-stone-300">ARCHER</div>
            </div>
            <div class="rcard" data-role="knight"   onclick="lobbySelectRole('knight')">
              <div class="text-xl mb-1">⚔️</div>
              <div class="text-[9px] font-bold tracking-wider text-stone-300">KNIGHT</div>
            </div>
            <div class="rcard" data-role="tank"     onclick="lobbySelectRole('tank')">
              <div class="text-xl mb-1">🛡️</div>
              <div class="text-[9px] font-bold tracking-wider text-stone-300">TANK</div>
            </div>
            <div class="rcard" data-role="assassin" onclick="lobbySelectRole('assassin')">
              <div class="text-xl mb-1">🗡️</div>
              <div class="text-[9px] font-bold tracking-wider text-stone-300">ASSASSIN</div>
            </div>
            <div class="rcard" data-role="mage"     onclick="lobbySelectRole('mage')">
              <div class="text-xl mb-1">🔮</div>
              <div class="text-[9px] font-bold tracking-wider text-stone-300">MAGE</div>
            </div>
          </div>
          <select id="lobby-role" class="hidden">
            <option value="archer">archer</option>
            <option value="knight">knight</option>
            <option value="tank">tank</option>
            <option value="assassin">assassin</option>
            <option value="mage">mage</option>
          </select>
        </div>

        <div class="lfield mb-2">
          <label class="block text-[10px] uppercase tracking-[1.5px] text-stone-500 font-semibold mb-1.5">Room ID</label>
          <input type="text" id="lobby-room" placeholder="ROOM-XXXX">
        </div>

        <button id="lobby-submit-auth">LOGIN</button>
        
        <button id="lobby-bypass-btn" 
                style="width: 100%; padding: 11px; margin-top: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(251,146,60,0.25); border-radius: 10px; color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: 1px; transition: all 0.2s;"
                onmouseover="this.style.background='rgba(251,146,60,0.08)'; this.style.color='#fb923c';"
                onmouseout="this.style.background='rgba(255,255,255,0.03)'; this.style.color='rgba(255,255,255,0.6)';">
          ⚙ SKIP & TEST VFX (OFFLINE)
        </button>
        
        <p id="lobby-error"></p>
      </div>

      <!-- Session / welcome panel -->
      <div id="lobby-session-panel" class="text-center" style="display:none;">
        <div class="savatar" id="welcome-avatar">?</div>
        <div class="text-xl font-black text-amber-100" id="welcome-name">Player</div>
        <div class="text-[11px] tracking-[2px] text-stone-500 mt-1" id="welcome-role">ARCHER</div>

        <div class="flex gap-2.5 my-5">
          <div class="flex-1 text-center py-2.5 px-2 rounded-xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);">
            <div class="text-[9px] uppercase tracking-wider text-stone-600">Level</div>
            <div class="text-base font-bold text-amber-400 mt-0.5" id="ws-level">1</div>
          </div>
          <div class="flex-1 text-center py-2.5 px-2 rounded-xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);">
            <div class="text-[9px] uppercase tracking-wider text-stone-600">Role</div>
            <div class="text-base font-bold text-amber-400 mt-0.5" id="ws-role">-</div>
          </div>
          <div class="flex-1 text-center py-2.5 px-2 rounded-xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);">
            <div class="text-[9px] uppercase tracking-wider text-stone-600">HP</div>
            <div class="text-base font-bold text-amber-400 mt-0.5" id="ws-hp">-</div>
          </div>
        </div>

        <div class="lfield mb-2 text-left">
          <label class="block text-[10px] uppercase tracking-[1.5px] text-stone-500 font-semibold mb-1.5">Room ID</label>
          <input type="text" id="lobby-room-session" placeholder="ROOM-XXXX">
        </div>
        <button id="lobby-submit-session">ENTER GAME</button>
        <button id="lobby-logout-btn">Logout (switch account)</button>
      </div>
    </div>
  </div>

  <script>
    function lobbySetTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      const rs  = document.getElementById('lobby-role-section');
      const btn = document.getElementById('lobby-submit-auth');
      if (tab === 'register') {
        rs.style.display = 'block';
        if (btn) btn.textContent = 'CREATE ACCOUNT';
        document.getElementById('lobby-password').autocomplete = 'new-password';
      } else {
        rs.style.display = 'none';
        if (btn) btn.textContent = 'LOGIN';
        document.getElementById('lobby-password').autocomplete = 'current-password';
      }
      window._lobbyTab = tab;
    }
    window._lobbyTab = 'login';

    function lobbySelectRole(role) {
      document.querySelectorAll('.rcard').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.rcard[data-role="${role}"]`)?.classList.add('selected');
      document.getElementById('lobby-role').value = role;
      localStorage.setItem('playerRole', role);
    }
    lobbySelectRole(localStorage.getItem('playerRole') || 'archer');

    (function() {
      const hash = window.location.hash;
      const roomVal = (hash && hash !== '#') ? hash.substring(1) : 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
      const ri  = document.getElementById('lobby-room');
      const ris = document.getElementById('lobby-room-session');
      const uIn = document.getElementById('lobby-username');
      const savedUser = localStorage.getItem('playerName');
      if (ri)  ri.value  = roomVal;
      if (ris) ris.value = roomVal;
      if (uIn && savedUser) uIn.value = savedUser;
    })();

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const authBtn = document.getElementById('lobby-submit-auth');
        const sessBtn = document.getElementById('lobby-submit-session');
        const overlay = document.getElementById('lobby-overlay');
        if (overlay && overlay.style.display !== 'none') {
          const authPanel = document.getElementById('lobby-auth-panel');
          if (authPanel && authPanel.style.display !== 'none') {
            authBtn?.click();
          } else {
            sessBtn?.click();
          }
        }
      }
    });
  </script>



  <div id="stats" style="display: none;">
    FPS: <span id="fps">--</span><br>
  </div>
  <div id="canvas-container"></div>
  <div id="dps-panel" style="display: none;">
    <div class="selector-title" style="color: #ff3e3e; margin-bottom: 8px;">DPS Statistics</div>
    <div class="dps-stat">DPS (Current): <span id="dps-val" style="color: #00ffaa; font-weight: bold;">0</span></div>
    <div class="dps-stat">DPS (Average): <span id="dps-avg" style="color: #00d2ff; font-weight: bold;">0</span></div>
    <div class="dps-stat">APS (Current): <span id="aps-val" style="color: #ffaa00; font-weight: bold;">0</span>/s</div>
    <div class="dps-stat">APS (Average): <span id="aps-avg" style="color: #ff8800; font-weight: bold;">0</span>/s</div>
    <div class="dps-stat">Total Damage: <span id="dps-total">0</span></div>
    <div class="dps-stat">Combat Time: <span id="dps-time">0s</span></div>
    <button id="dps-reset" style="margin-top: 10px; width: 100%; background: #374151; border: 1px solid #4b5563; border-radius: 4px; color: white; padding: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: background 0.2s;">Reset Statistics</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
